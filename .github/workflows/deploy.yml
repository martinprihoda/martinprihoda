name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Runs on the VPS itself: its firewall only allows SSH from CZ/SK, so GitHub-hosted runners can't push there.
    runs-on: [self-hosted, martinprihoda]
    environment:
      name: production
      url: https://martinprihoda.cz
    steps:
      - uses: actions/checkout@v5

      - name: Sync files
        run: |
          rsync -rlcv --delete --omit-dir-times \
            --exclude=.git --exclude=.github --exclude=README.md \
            ./ /www/hosting/martinprihoda.cz/www/
