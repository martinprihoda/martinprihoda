name: Deploy

on:
  push:
    branches: [master, production]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'master' || github.ref_name == 'production'
    # Runs on the VPS itself: its firewall only allows SSH from CZ/SK, so GitHub-hosted runners can't push there.
    runs-on: [self-hosted, martinprihoda]
    environment:
      name: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
      url: ${{ github.ref_name == 'production' && 'https://martinprihoda.cz' || 'https://dev.martinprihoda.cz' }}
    env:
      TARGET: /www/hosting/martinprihoda.cz/${{ github.ref_name == 'production' && 'www' || 'dev' }}/
    steps:
      - uses: actions/checkout@v5

      - name: Sync files
        run: |
          rsync -rlcv --delete --omit-dir-times \
            --exclude=.git --exclude=.github --exclude=README.md \
            ./ "$TARGET"

      # rsync keeps the mode of files it overwrites, so drop any world-writable bits left by earlier files.
      - name: Fix permissions
        run: find "$TARGET" -user "$(id -un)" -perm /o+w -exec chmod o-w {} +
